<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1820 1310" width="1820" height="1310" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#717171"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9AA0A6"/>
    </marker>
    <style>
      .band   { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; fill: #717171; }
      .t      { font-size: 17px; font-weight: 700; fill: #222222; }
      .s      { font-size: 13.5px; fill: #717171; }
      .lbl    { font-size: 12px; fill: #717171; }
      .lbl-dim{ font-size: 12px; fill: #9AA0A6; }
      .title  { font-size: 27px; font-weight: 700; fill: #222222; }
      .sub    { font-size: 14.5px; fill: #717171; }
      .foot   { font-size: 13.5px; fill: #717171; }
      .foot b { fill: #222222; }
    </style>
  </defs>

  <rect x="0" y="0" width="1820" height="1310" fill="#FFFFFF"/>

  <text class="title" x="90" y="52">Airbnb-class marketplace — production architecture</text>
  <text class="sub" x="90" y="80">Request path (left column), data and asynchronous paths (right), and the operations that surround them. The delivered submission implements the frontend box only.</text>

  <!-- legend -->
  <line x1="1320" y1="44" x2="1372" y2="44" stroke="#717171" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="lbl" x="1382" y="48">synchronous path</text>
  <line x1="1320" y1="70" x2="1372" y2="70" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dim)"/>
  <text class="lbl" x="1382" y="74">asynchronous / derived</text>

  <!-- ================= BAND LABELS ================= -->
  <text class="band" x="44" y="151"  transform="rotate(-90 44 151)"  text-anchor="middle">CLIENTS</text>
  <text class="band" x="44" y="255"  transform="rotate(-90 44 255)"  text-anchor="middle">EDGE</text>
  <text class="band" x="44" y="359"  transform="rotate(-90 44 359)"  text-anchor="middle">FRONTEND</text>
  <text class="band" x="44" y="463"  transform="rotate(-90 44 463)"  text-anchor="middle">API GATEWAY</text>
  <text class="band" x="44" y="590"  transform="rotate(-90 44 590)"  text-anchor="middle">DOMAIN SERVICES</text>
  <text class="band" x="44" y="745"  transform="rotate(-90 44 745)"  text-anchor="middle">DATA &amp; STORAGE</text>
  <text class="band" x="44" y="876"  transform="rotate(-90 44 876)"  text-anchor="middle">EVENT BACKBONE</text>
  <text class="band" x="44" y="991"  transform="rotate(-90 44 991)"  text-anchor="middle">ASYNC WORKERS</text>
  <text class="band" x="44" y="1120" transform="rotate(-90 44 1120)" text-anchor="middle">PLATFORM &amp; OPS</text>

  <!-- ================= BAND 1 — CLIENTS ================= -->
  <rect x="90" y="124" width="1610" height="54" rx="12" fill="#FFF7F8" stroke="#FFD3DB"/>
  <text class="t" x="110" y="157">Guests &amp; Hosts<tspan class="s">  —  desktop web · mobile web · native app · host dashboard</tspan></text>

  <!-- ================= BAND 2 — EDGE ================= -->
  <rect x="90" y="228" width="1610" height="54" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text class="t" x="110" y="261">CDN / Edge Network<tspan class="s">  —  TLS termination · WAF &amp; bot defence · edge cache · on-the-fly image transforms</tspan></text>

  <!-- ================= BAND 3 — FRONTEND ================= -->
  <rect x="90" y="332" width="1610" height="54" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text class="t" x="110" y="365">Next.js App Router on Vercel<tspan class="s">  —  SSR + ISR listing pages · server components · route handlers · streaming</tspan></text>

  <!-- ================= BAND 4 — API GATEWAY ================= -->
  <rect x="90" y="436" width="1610" height="54" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text class="t" x="110" y="469">API Gateway<tspan class="s">  —  authentication / authorisation · rate limiting · request routing · schema validation</tspan></text>

  <!-- ================= BAND 5 — DOMAIN SERVICES ================= -->
  <g>
    <rect x="90"   y="540" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
    <text class="t" x="106" y="572">Listings</text>
    <text class="s" x="106" y="596">listing CRUD · media</text>
    <text class="s" x="106" y="616">availability calendar</text>

    <rect x="362"  y="540" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
    <text class="t" x="378" y="572">Users &amp; Auth</text>
    <text class="s" x="378" y="596">identity · OAuth</text>
    <text class="s" x="378" y="616">profiles · host KYC</text>

    <rect x="634"  y="540" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
    <text class="t" x="650" y="572">Bookings</text>
    <text class="s" x="650" y="596">reservations · pricing</text>
    <text class="s" x="650" y="616">date locking · cancellation</text>

    <rect x="906"  y="540" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
    <text class="t" x="922" y="572">Search</text>
    <text class="s" x="922" y="596">query parsing · filters</text>
    <text class="s" x="922" y="616">ranking · geo radius</text>

    <rect x="1178" y="540" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
    <text class="t" x="1194" y="572">Payments</text>
    <text class="s" x="1194" y="596">charges · refunds</text>
    <text class="s" x="1194" y="616">host payouts</text>

    <rect x="1450" y="540" width="250" height="100" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
    <text class="t" x="1466" y="572">Messaging</text>
    <text class="s" x="1466" y="596">guest &#8596; host threads</text>
    <text class="s" x="1466" y="616">thread history</text>
  </g>

  <!-- ================= BAND 6 — DATA & STORAGE ================= -->
  <g>
    <rect x="90"   y="690" width="304" height="110" rx="12" fill="#F7F7F7" stroke="#DDDDDD"/>
    <text class="t" x="106" y="724">PostgreSQL (primary)</text>
    <text class="s" x="106" y="750">source of truth · all writes</text>
    <text class="s" x="106" y="772">bookings, listing, users, ledger</text>

    <rect x="416"  y="690" width="304" height="110" rx="12" fill="#F7F7F7" stroke="#DDDDDD"/>
    <text class="t" x="432" y="724">Read replicas</text>
    <text class="s" x="432" y="750">listing &amp; browse reads</text>
    <text class="s" x="432" y="772">scale reads horizontally</text>

    <rect x="742"  y="690" width="304" height="110" rx="12" fill="#F7F7F7" stroke="#DDDDDD"/>
    <text class="t" x="758" y="724">Redis</text>
    <text class="s" x="758" y="750">cache · sessions</text>
    <text class="s" x="758" y="772">rate-limit counters</text>

    <rect x="1068" y="690" width="304" height="110" rx="12" fill="#F7F7F7" stroke="#DDDDDD"/>
    <text class="t" x="1084" y="724">OpenSearch</text>
    <text class="s" x="1084" y="750">search &amp; geo index</text>
    <text class="s" x="1084" y="772">derived, never authoritative</text>

    <rect x="1394" y="690" width="304" height="110" rx="12" fill="#F7F7F7" stroke="#DDDDDD"/>
    <text class="t" x="1410" y="724">Object storage + CDN</text>
    <text class="s" x="1410" y="750">listing photos, immutable</text>
    <text class="s" x="1410" y="772">hashed derivatives at the edge</text>
  </g>

  <!-- ================= BAND 7 — EVENT BACKBONE ================= -->
  <rect x="90" y="850" width="1060" height="52" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text class="t" x="110" y="883">Kafka event stream<tspan class="s">  —  domain events + change-data-capture out of PostgreSQL</tspan></text>
  <text class="lbl" x="1200" y="870">fans out to consumers:</text>
  <text class="lbl" x="1200" y="890">search · notifications · ledger · analytics</text>

  <!-- ================= BAND 8 — ASYNC WORKERS ================= -->
  <g>
    <rect x="90"   y="952" width="522" height="78" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
    <text class="t" x="106" y="984">Search indexer</text>
    <text class="s" x="106" y="1008">consumes CDC, writes OpenSearch — index is rebuildable</text>

    <rect x="634"  y="952" width="522" height="78" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
    <text class="t" x="650" y="984">Notifications</text>
    <text class="s" x="650" y="1008">email / push driven by booking &amp; message events</text>

    <rect x="1178" y="952" width="522" height="78" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
    <text class="t" x="1194" y="984">Ledger &amp; payouts</text>
    <text class="s" x="1194" y="1008">settlement, reconciliation and payout retries</text>
  </g>

  <!-- ================= BAND 9 — PLATFORM & OPS ================= -->
  <g>
    <rect x="90"  y="1080" width="794" height="80" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
    <text class="t" x="106" y="1112">Observability</text>
    <text class="s" x="106" y="1136">OpenTelemetry traces + metrics &#8594; Prometheus / Grafana · Sentry · centralised logs</text>

    <rect x="906" y="1080" width="794" height="80" rx="12" fill="#FFFFFF" stroke="#DDDDDD"/>
    <text class="t" x="922" y="1112">CI / CD</text>
    <text class="s" x="922" y="1136">GitHub Actions: build &#8594; test &#8594; deploy · canary + automatic rollback</text>
  </g>

  <!-- ================= ARROWS ================= -->
  <line x1="895" y1="178" x2="895" y2="226" stroke="#717171" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="lbl" x="907" y="208">HTTPS</text>

  <line x1="895" y1="282" x2="895" y2="330" stroke="#717171" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="lbl" x="907" y="312">cached HTML / JS</text>

  <line x1="895" y1="386" x2="895" y2="434" stroke="#717171" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="lbl" x="907" y="416">fetch / route handler</text>

  <line x1="895" y1="490" x2="895" y2="538" stroke="#717171" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="lbl" x="907" y="520">routed request</text>

  <line x1="895" y1="640" x2="895" y2="688" stroke="#717171" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="lbl" x="907" y="670">reads / writes</text>

  <!-- replication within the data band -->
  <line x1="394" y1="745" x2="414" y2="745" stroke="#717171" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="lbl" x="404" y="735" text-anchor="middle">replication</text>

  <!-- CDC: postgres -> kafka -->
  <line x1="242" y1="800" x2="242" y2="848" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dim)"/>
  <text class="lbl-dim" x="252" y="830">CDC</text>

  <!-- kafka -> workers -->
  <line x1="400" y1="902" x2="400" y2="950" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dim)"/>
  <text class="lbl-dim" x="410" y="932">consume</text>

  <!-- indexer -> opensearch -->
  <path d="M612 991 H1250 V800" fill="none" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dim)"/>
  <text class="lbl-dim" x="1236" y="925" text-anchor="end">index writes</text>

  <!-- media: object storage -> image cdn -> edge -->
  <path d="M1698 745 H1770 V255 H1702" fill="none" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dim)"/>
  <text class="lbl-dim" x="1782" y="640" transform="rotate(-90 1782 640)" text-anchor="middle">image variants</text>

  <!-- ================= FOOTER NOTES ================= -->
  <text class="foot" x="90" y="1210"><tspan font-weight="700">Scope —</tspan> the submission implements the Next.js frontend plus local mock data. Every other box describes the production system that frontend would sit inside; none of it is built here.</text>
  <text class="foot" x="90" y="1234"><tspan font-weight="700">Why these stores —</tspan> PostgreSQL stays authoritative so bookings cannot be corrupted by a derived index; Redis absorbs read bursts and session lookups; OpenSearch is fed only from Kafka so it can be rebuilt.</text>
  <text class="foot" x="90" y="1258"><tspan font-weight="700">Multi-region —</tspan> the edge is global; stateless services run active-active in two regions; one regional PostgreSQL primary with cross-region read replicas; failover promotes a replica.</text>
  <text class="foot" x="90" y="1282"><tspan font-weight="700">Payments &amp; messaging —</tspan> kept as separate services because both own PCI / delivery concerns and need independent scaling and failure isolation from the booking path.</text>
</svg>
